name: Node.js CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - development
  # Daily refresh so :stage picks up new releases / roadmap / team
  # changes from gofr-dev/gofr without waiting for the next merge to
  # main. 04:00 UTC is a low-traffic window.
  schedule:
    - cron: '0 4 * * *'
  # Manual button — useful right after a GoFr release lands so stage
  # reflects the new version without waiting for the cron.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Build App
        run: |
          yarn install
          yarn build

  # Publishes :stage. Runs on:
  #   - push to main          (every merge → fresh :stage)
  #   - schedule (cron daily) (auto-refresh data even without a merge)
  #   - workflow_dispatch     (manual button for ad-hoc refresh)
  # Skipped on PR builds and on tag pushes (prod path).
  publish_stage:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Refresh data from GitHub (snapshot fallback on failure)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn refresh-data
        continue-on-error: true

      - name: Log in to the Container registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (:stage)
        uses: docker/build-push-action@v4
        with:
          push: true
          context: .
          file: Dockerfile
          tags: ghcr.io/gofr-dev/website:stage

  # On tag v* push → publish :latest (+ versioned tag). The framework's
  # prod deploy (website-prod.yml on tag-push) pulls :latest, so prod
  # tracks the tagged release of this repo.
  release_package:
    if: ${{ startsWith(github.ref, 'refs/tags/v')}}
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        # Full history is needed by utils/generate-doc-mtimes.mjs which
        # reads `git log` per source file to compute the visible
        # "Last updated" byline. A shallow clone would give every doc
        # the same boot timestamp.
        with:
          fetch-depth: 0

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Pull fresh data from GitHub at deploy time — releases, roadmap
      # milestones, team profiles + contributor list, and per-doc git
      # mtimes. The fetch scripts each have a snapshot fallback: on a
      # rate-limited or transient failure they keep the previously-
      # committed JSON rather than emitting an empty file.
      #
      # `continue-on-error: true` makes this step non-blocking — even
      # in the worst case (every API call failed) the build proceeds
      # with the committed snapshots, never an empty website.
      #
      # Auth uses the workflow's built-in GITHUB_TOKEN (1000 req/hr),
      # which is enough for our ~150-request refresh and avoids the
      # 60/hr unauthenticated cliff.
      - name: Refresh data from GitHub (snapshot fallback on failure)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn refresh-data
        continue-on-error: true

      - name: Log in to the Container registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Release Tag
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Build and push Docker image (:latest + :v*)
        uses: docker/build-push-action@v4
        with:
          push: true
          context: .
          file: Dockerfile
          tags: ghcr.io/gofr-dev/website:${{ env.RELEASE_VERSION }},ghcr.io/gofr-dev/website:latest
